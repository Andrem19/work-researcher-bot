location = /jobs {
    alias /var/lib/work-researcher-bot/market/site/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location = /jobs/ {
    return 301 /jobs;
}

location = /jobs/data.json {
    alias /var/lib/work-researcher-bot/market/site/data.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location ^~ /jobs/ {
    return 404;
}
